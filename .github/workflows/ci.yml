name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Check compiler warnings
        run: cargo check --all-targets
        env:
          RUSTFLAGS: "-D warnings"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Rclone (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15"
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg rclone

      - name: Set up FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rclone (Windows)
        if: runner.os == 'Windows'
        run: choco install rclone --no-progress

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo tests
        run: cargo test --all-targets

  npm-test:
    name: npm Package Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm package tests
        run: node scripts/test-npm-packages.js
