name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0 or v0.2.0-beta.1)'
        required: false
        default: ''
      prerelease:
        description: 'Publish as pre-release (auto, true, false)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
      npm_tag:
        description: 'npm dist-tag override (e.g. latest, next, beta, alpha, rc, or auto)'
        required: false
        default: 'auto'

permissions:
  contents: write
  id-token: write

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag, version, and release type
        id: version
        run: |
          RAW_TAG="${{ inputs.tag }}"
          if [ -z "$RAW_TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RAW_TAG="${{ github.ref_name }}"
            fi
          fi

          node scripts/prepare-npm.js --resolve-release \
            --tag "$RAW_TAG" \
            --prerelease "${{ inputs.prerelease || 'auto' }}" \
            --npm-tag "${{ inputs.npm_tag || 'auto' }}"

  build-linux:
    name: Build Linux (x86_64 & aarch64 musl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: |
          pip install --break-system-packages cargo-zigbuild || pip install cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: Build binaries with cargo-zigbuild
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl
          cargo zigbuild --release --target aarch64-unknown-linux-musl

      - name: Package Linux release archives
        run: |
          mkdir -p dist/linux-x64 dist/linux-arm64
          cp target/x86_64-unknown-linux-musl/release/chzzk-load dist/linux-x64/
          cp README.md README.ko.md LICENSE dist/linux-x64/
          tar -czvf chzzk-load-linux-x64.tar.gz -C dist/linux-x64 chzzk-load README.md README.ko.md LICENSE

          cp target/aarch64-unknown-linux-musl/release/chzzk-load dist/linux-arm64/
          cp README.md README.ko.md LICENSE dist/linux-arm64/
          tar -czvf chzzk-load-linux-arm64.tar.gz -C dist/linux-arm64 chzzk-load README.md README.ko.md LICENSE

      - name: Compute SHA256 checksums
        run: |
          sha256sum chzzk-load-linux-x64.tar.gz > chzzk-load-linux-x64.tar.gz.sha256
          sha256sum chzzk-load-linux-arm64.tar.gz > chzzk-load-linux-arm64.tar.gz.sha256

      - name: Prepare raw binaries for npm
        run: |
          cp target/x86_64-unknown-linux-musl/release/chzzk-load ./chzzk-load-linux-x64
          cp target/aarch64-unknown-linux-musl/release/chzzk-load ./chzzk-load-linux-arm64

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: |
            chzzk-load-linux-x64.tar.gz
            chzzk-load-linux-arm64.tar.gz
            chzzk-load-linux-x64.tar.gz.sha256
            chzzk-load-linux-arm64.tar.gz.sha256

      - name: Upload Linux raw binaries
        uses: actions/upload-artifact@v4
        with:
          name: raw-binaries-linux
          path: |
            chzzk-load-linux-x64
            chzzk-load-linux-arm64

  build-macos:
    name: Build macOS (x86_64 & aarch64 darwin)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build binaries
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Package macOS release archives
        run: |
          mkdir -p dist/darwin-x64 dist/darwin-arm64
          cp target/x86_64-apple-darwin/release/chzzk-load dist/darwin-x64/
          cp README.md README.ko.md LICENSE dist/darwin-x64/
          tar -czvf chzzk-load-darwin-x64.tar.gz -C dist/darwin-x64 chzzk-load README.md README.ko.md LICENSE

          cp target/aarch64-apple-darwin/release/chzzk-load dist/darwin-arm64/
          cp README.md README.ko.md LICENSE dist/darwin-arm64/
          tar -czvf chzzk-load-darwin-arm64.tar.gz -C dist/darwin-arm64 chzzk-load README.md README.ko.md LICENSE

      - name: Compute SHA256 checksums
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum chzzk-load-darwin-x64.tar.gz > chzzk-load-darwin-x64.tar.gz.sha256
            sha256sum chzzk-load-darwin-arm64.tar.gz > chzzk-load-darwin-arm64.tar.gz.sha256
          else
            shasum -a 256 chzzk-load-darwin-x64.tar.gz > chzzk-load-darwin-x64.tar.gz.sha256
            shasum -a 256 chzzk-load-darwin-arm64.tar.gz > chzzk-load-darwin-arm64.tar.gz.sha256
          fi

      - name: Prepare raw binaries for npm
        run: |
          cp target/x86_64-apple-darwin/release/chzzk-load ./chzzk-load-darwin-x64
          cp target/aarch64-apple-darwin/release/chzzk-load ./chzzk-load-darwin-arm64

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: |
            chzzk-load-darwin-x64.tar.gz
            chzzk-load-darwin-arm64.tar.gz
            chzzk-load-darwin-x64.tar.gz.sha256
            chzzk-load-darwin-arm64.tar.gz.sha256

      - name: Upload macOS raw binaries
        uses: actions/upload-artifact@v4
        with:
          name: raw-binaries-macos
          path: |
            chzzk-load-darwin-x64
            chzzk-load-darwin-arm64

  build-windows:
    name: Build Windows (x86_64 msvc)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build binary
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows release archive
        run: |
          mkdir -p dist/windows-x64
          cp target/x86_64-pc-windows-msvc/release/chzzk-load.exe dist/windows-x64/
          cp README.md README.ko.md LICENSE dist/windows-x64/
          if command -v 7z >/dev/null 2>&1; then
            (cd dist/windows-x64 && 7z a -tzip ../../chzzk-load-windows-x64.zip chzzk-load.exe README.md README.ko.md LICENSE)
          else
            tar -a -cf chzzk-load-windows-x64.zip -C dist/windows-x64 chzzk-load.exe README.md README.ko.md LICENSE
          fi

      - name: Compute SHA256 checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum chzzk-load-windows-x64.zip > chzzk-load-windows-x64.zip.sha256
          else
            shasum -a 256 chzzk-load-windows-x64.zip > chzzk-load-windows-x64.zip.sha256
          fi

      - name: Prepare raw binary for npm
        run: |
          cp target/x86_64-pc-windows-msvc/release/chzzk-load.exe ./chzzk-load.exe

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            chzzk-load-windows-x64.zip
            chzzk-load-windows-x64.zip.sha256

      - name: Upload Windows raw binary
        uses: actions/upload-artifact@v4
        with:
          name: raw-binaries-windows
          path: |
            chzzk-load.exe

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [get-version, build-linux, build-macos, build-windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Consolidate SHA256 checksums
        run: |
          cat release-assets/*.sha256 > release-assets/SHA256SUMS.txt
          echo "Consolidated SHA256SUMS.txt:"
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          files: |
            release-assets/chzzk-load-*.tar.gz
            release-assets/chzzk-load-*.zip
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.get-version.outputs.is_prerelease == 'true' && 'false' || 'true' }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [get-version, build-linux, build-macos, build-windows]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all raw binaries
        uses: actions/download-artifact@v4
        with:
          pattern: raw-binaries-*
          merge-multiple: true
          path: artifacts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Prepare npm packages
        run: |
          node scripts/prepare-npm.js --version ${{ needs.get-version.outputs.version }} --bin-dir ./artifacts

      - name: Publish npm packages via OIDC (Trusted Publisher)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.get-version.outputs.npm_tag }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret detected. Configuring auth token in ~/.npmrc..."
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          fi

          echo "Publishing platform packages to npm (tag: ${NPM_TAG}) via GitHub Actions OIDC..."
          for dir in npm/platforms/*; do
            if [ -d "$dir" ]; then
              echo "Publishing $dir with tag ${NPM_TAG}..."
              (cd "$dir" && npm publish --provenance --access public --tag "${NPM_TAG}")
            fi
          done

          echo "Publishing root package chzzk-load (tag: ${NPM_TAG}) via GitHub Actions OIDC..."
          (cd npm/chzzk-load && npm publish --provenance --access public --tag "${NPM_TAG}")

