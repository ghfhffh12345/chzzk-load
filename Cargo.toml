[package]
name = "chzzk-load"
version = "0.11.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance real-time Naver Chzzk live stream recorder and cloud archiver"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ghfhffh12345/chzzk-load"
homepage = "https://github.com/ghfhffh12345/chzzk-load"
keywords = ["chzzk", "livestream", "recorder", "ffmpeg", "tui"]
categories = ["command-line-utilities", "multimedia::video"]

[lints.rust]
linker_messages = "allow"

[dependencies]
# Async runtime & concurrency
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["async-await", "sink", "std"] }

# HTTP client & WebSockets
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# Terminal User Interface (TUI)
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }

# Serialization & configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Command line interface
clap = { version = "4.6", features = ["derive"] }

# Data encoding & time utilities
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rand = "0.10"
tiny_http = "0.12"

[lib]
name = "chzzk_load"
path = "src/lib.rs"

[[bin]]
name = "chzzk-load"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
